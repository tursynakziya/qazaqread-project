{# expects: session; shows the teacher's mark as a coloured badge #}{% if session.mark %}<span title="Мұғалім бағасы{% if session.marked_at %} • {{ session.marked_at|date:'d.m.Y' }}{% endif %}" class="inline-flex items-center gap-1 px-space-sm py-0.5 rounded-full font-label-sm text-label-sm font-bold whitespace-nowrap {% if session.mark == 5 %}bg-green-200 text-green-900{% elif session.mark == 4 %}bg-sky-200 text-sky-900{% elif session.mark == 3 %}bg-yellow-200 text-yellow-900{% else %}bg-red-200 text-red-900{% endif %}"><span class="material-symbols-outlined text-[16px]">grade</span>Баға: {{ session.mark }}</span>{% endif %}
