<div class="flex flex-col gap-1.5">
  {% if field.widget_type == "checkbox" %}
  <label class="flex items-start gap-space-sm font-body-sm text-body-sm text-on-surface-variant cursor-pointer">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
  <label class="font-label-md text-label-md text-on-surface" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-error">*</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="font-body-sm text-body-sm text-on-surface-variant">{{ field.help_text|safe }}</span>{% endif %}
  {% for error in field.errors %}<span class="font-body-sm text-body-sm text-error">{{ error }}</span>{% endfor %}
</div>
